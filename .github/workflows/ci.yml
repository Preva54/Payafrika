name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PayAfrika.slnx

      - name: Build
        run: dotnet build PayAfrika.slnx --no-restore --nologo

      - name: Test
        run: dotnet test PayAfrika.API.Tests --no-build --nologo --verbosity normal

  frontend:
    name: Frontend typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build --webpack
        env:
          NEXT_PUBLIC_API_URL: https://pafrikav2-api.ambitiousocean-b7255ba5.northeurope.azurecontainerapps.io/api
          NEXT_PUBLIC_APP_URL: https://payafrika.vercel.app
